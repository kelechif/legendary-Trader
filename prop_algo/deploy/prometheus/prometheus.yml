# Scrape prop_algo light-path /metrics endpoints on the compose Docker network.
# Used by docker-compose.metrics.yml (profile metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prop_algo
    metrics_path: /metrics
    static_configs:
      - targets:
          - market_data_service:8000
          - risk_service:8001
          - execution_service:8002
          - learning_service:8003
          - unified_core_service:8004
        labels:
          stack: prop_algo
