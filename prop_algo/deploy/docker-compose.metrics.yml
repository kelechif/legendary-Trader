# Optional Prometheus + Grafana overlay (NOT part of the light path).
#
# From this directory:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml --profile metrics up -d
#
# Scrapes light-path /metrics via the compose Docker network (service:port).
# Grafana: http://127.0.0.1:3000  (admin / admin, local only)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      market_data_service:
        condition: service_started
      risk_service:
        condition: service_started
      execution_service:
        condition: service_started
      learning_service:
        condition: service_started
      unified_core_service:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["metrics"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/prop_algo-overview.json:/var/lib/grafana/dashboards/prop_algo-overview.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
