# Mission UI (FastAPI + WS) — matches compose mission_ui on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-ui
  namespace: prop-algo
  labels:
    app: mission-ui
    prop-algo/role: light
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mission-ui
  template:
    metadata:
      labels:
        app: mission-ui
        prop-algo/role: light
    spec:
      containers:
        - name: mission-ui
          image: prop_algo:light
          imagePullPolicy: IfNotPresent
          command:
            [
              "uvicorn",
              "mission_ui.app:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8080",
            ]
          envFrom:
            - configMapRef:
                name: prop-algo-env
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mission-ui
  namespace: prop-algo
  labels:
    app: mission-ui
spec:
  type: NodePort
  selector:
    app: mission-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
