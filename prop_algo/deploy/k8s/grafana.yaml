# Optional Grafana for local/dev clusters (not production-hardened).
# Provisions Prometheus datasource + loads the prop_algo overview dashboard.
#
# Dashboard JSON lives at ../grafana/prop_algo-overview.json (single source of truth).
# Apply (from this directory):
#   kubectl -n prop-algo create configmap grafana-dashboard-prop-algo \
#     --from-file=prop_algo-overview.json=../grafana/prop_algo-overview.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f grafana.yaml
# Optional Prometheus Operator scrape path:
#   kubectl apply -f prometheus.yaml -f servicemonitor.yaml
# UI: NodePort http://<node>:30300  (admin / admin)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: prop-algo
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        isDefault: true
        editable: true
        url: http://prometheus-operated.prop-algo.svc:9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: prop-algo
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: prop_algo
        orgId: 1
        folder: prop_algo
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: prop-algo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-prop-algo
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: prop-algo
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
