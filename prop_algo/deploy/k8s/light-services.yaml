# Light-path app Deployments/Services matching prop_algo/deploy/docker-compose.yml.
# Image: build once from repo root, then load into the cluster:
#   docker build -f prop_algo/deploy/Dockerfile -t prop_algo:light .
#   kind load docker-image prop_algo:light   # or minikube image load / retag to a registry
#
# All services share the same image; only command differs (same as compose).
# Brokers default to mock in-cluster. Live MT5/cTrader: run on Windows host (see deploy README).
# MARL/sim need torch — see docker-compose.torch.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prop-algo-env
  namespace: prop-algo
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  BROKER_ADAPTER: mock
  NEURAL_EXECUTION: "1"
  RISK_OFF_ENABLED: "1"
---
# --- market_data_service (metrics :8000) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: prop-algo
  labels:
    app: market-data-service
    prop-algo/role: light
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      labels:
        app: market-data-service
        prop-algo/role: light
    spec:
      containers:
        - name: market-data-service
          image: prop_algo:light
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.market_data_service.main"]
          envFrom:
            - configMapRef:
                name: prop-algo-env
          ports:
            - name: metrics
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
  namespace: prop-algo
  labels:
    app: prop-service
    prop-algo/component: market-data-service
spec:
  selector:
    app: market-data-service
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
