# Light path only (no operator CRDs). Apply from this directory:
#   kubectl apply -k .
# Optional monitoring: kubectl apply -f grafana.yaml
#   (and prometheus.yaml / servicemonitor.yaml if prometheus-operator is installed)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prop-algo
resources:
  - namespace.yaml
  - redis.yaml
  - light-services.yaml
  - mission-ui.yaml
