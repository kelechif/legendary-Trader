# legendary-Trader default configuration
# All symbols use Yahoo Finance tickers. Futures use the "=F" continuous-contract
# suffix (e.g. ES=F is the S&P 500 e-mini, CL=F is WTI crude, GC=F is gold).

watchlist:
  stocks:
    - AAPL
    - MSFT
    - SPY
  futures:
    - ES=F   # S&P 500 e-mini
    - CL=F   # crude oil
    - GC=F   # gold

data:
  interval: "1d"     # bar size: 1d, 1h, etc. (subject to Yahoo Finance limits)
  history_period: "2y"  # how much history to pull for training/backtesting

model:
  type: random_forest       # random_forest | gradient_boosting
  n_estimators: 300
  max_depth: 6
  lookahead_bars: 1         # predict direction N bars ahead
  up_threshold_pct: 0.0     # label 1 (up) if forward return > this
  train_test_split: 0.8     # chronological split, no shuffling
  min_probability: 0.55     # minimum model confidence to act on a signal

risk:
  risk_per_trade_pct: 0.01     # fraction of equity risked per trade
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 3.0
  max_position_pct: 0.25       # max fraction of equity in a single position
  max_open_positions: 5
  daily_loss_limit_pct: 0.03   # halt new trades after this daily drawdown

backtest:
  starting_cash: 100000
  commission_per_share: 0.0
  slippage_pct: 0.0005

broker:
  mode: paper   # paper | alpaca  (alpaca requires ALPACA_API_KEY / ALPACA_SECRET_KEY env vars)
  account_file: "paper_account.json"

trader:
  poll_interval_seconds: 3600  # how often the live/paper loop re-evaluates
